[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orison-ai"
version = "1.0.0"
description = "Modern, optimized AI gateway for document processing, summarization, and Google Scholar operations"
authors = [{name = "Orison AI"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "fastapi",
    "openai",
    "scholarly",
    "functions-framework",
    "requests",
    "firebase_admin",
    "google-cloud-firestore",
    "mongoengine",
    "pymongo",
    "google-cloud-secret-manager",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "langsmith>=0.1.0",
    "langgraph>=0.2.0",
    "qdrant_client>=1.11.0",
    "langchain_qdrant>=0.1.0",
    "pypdf",
    "unstructured",
    "markdown",
    "python-docx",
    "pytest",
    "pytest-asyncio",
    "tiktoken",
    "httpx",
    "anyio",
    "pydantic",
    "python-multipart",
    "uvicorn",
    "google-cloud-storage",
    "serpapi",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "black>=22.0",
    "flake8>=5.0",
    "mypy>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["data/tests", "services/tests", "storage/tests", "core/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v -s --tb=short" 